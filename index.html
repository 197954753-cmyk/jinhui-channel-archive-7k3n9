<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#073825">
  <title>金徽酒经销商合作档案</title>
  <style>
    :root{--canvas:#f1efe7;--paper:#fffdf8;--ink:#17251f;--muted:#758078;--green:#0b4b33;--green-deep:#073825;--gold:#b99049;--line:#dedfd6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 8% 0%,rgba(185,144,73,.2),transparent 28rem),linear-gradient(180deg,#f6f4ed,#e7ebe5);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    .gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#073825,#0b4b33)}
    .gate:before{content:"";position:absolute;width:min(72vw,820px);height:min(72vw,820px);border:1px solid rgba(241,229,202,.18);border-radius:50%;right:-24vw;top:-32vw}
    .card{position:relative;z-index:1;width:min(460px,100%);padding:36px;background:var(--paper);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.28)}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.seal{display:grid;place-items:center;width:50px;height:50px;border-radius:15px 6px 15px 6px;color:var(--paper);background:var(--green);font-family:"Songti SC","STSong",serif;font-size:25px;box-shadow:inset 0 0 0 4px rgba(241,229,202,.15)}
    .brand strong{display:block;color:var(--green-deep);font-family:"Songti SC","STSong",serif;font-size:19px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.15em}
    h1{margin:0;color:var(--green-deep);font-family:"Songti SC","STSong",serif;font-size:30px;letter-spacing:.03em}.copy{margin:9px 0 24px;color:var(--muted);font-size:13px;line-height:1.7}
    label{display:block;margin-bottom:7px;color:var(--ink);font-size:12px;font-weight:700}input{width:100%;height:52px;padding:0 15px;color:var(--green-deep);background:#f7f5ed;border:1px solid var(--line);border-radius:10px;outline:none;font:600 15px "PingFang SC","Microsoft YaHei",sans-serif}input:focus{background:#fff;border-color:#2d7355;box-shadow:0 0 0 3px rgba(45,115,85,.12)}
    button{width:100%;height:50px;margin-top:12px;color:#fff;background:var(--green);border:0;border-radius:10px;cursor:pointer;font-weight:700;letter-spacing:.08em}button:hover{background:var(--green-deep)}button:disabled{cursor:wait;opacity:.65}
    .status{display:none;margin:12px 0 0;font-size:12px;line-height:1.6}.status.show{display:block}.status.error{color:#a1483f}.status.progress{color:#617068}.privacy{margin:18px 0 0;padding-top:15px;border-top:1px solid var(--line);color:#8a948d;font-size:10.5px;line-height:1.65}
    @media(max-width:540px){.card{padding:28px 22px}h1{font-size:27px}}
  </style>
</head>
<body>
  <main class="gate">
    <section class="card">
      <div class="brand"><div class="seal" aria-hidden="true">金</div><div><strong>金徽酒 · 渠道档案</strong><span>JINHUI CHANNEL ARCHIVE</span></div></div>
      <h1>访问验证</h1>
      <p class="copy">请输入内部访问口令。数据仅在本机浏览器内解密，不会以明文存储在服务器。</p>
      <form id="unlockForm">
        <label for="password">访问口令</label>
        <input id="password" type="password" autocomplete="current-password" spellcheck="false" maxlength="64" placeholder="请输入内部访问口令">
        <button id="unlockButton" type="submit">解密并打开看板</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="privacy">内部资料 · 请勿转发至无关人员 · 页面禁止搜索引擎收录</p>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const SALT = Uint8Array.from(atob("9NspwGOz/T/lwrJLc64Bug=="), c => c.charCodeAt(0));
      const IV = Uint8Array.from(atob("kFODee02+Uv6KQn6"), c => c.charCodeAt(0));
      const ITERATIONS = 210000;
      const form = document.getElementById("unlockForm");
      const input = document.getElementById("password");
      const button = document.getElementById("unlockButton");
      const status = document.getElementById("status");

      function showStatus(message, type) {
        status.textContent = message;
        status.className = "status show " + type;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!input.value) {
          showStatus("请输入访问口令", "error");
          input.focus();
          return;
        }
        button.disabled = true;
        showStatus("正在验证并解密，请稍候…", "progress");
        try {
          window.__unlockStage = "import";
          const encoder = new TextEncoder();
          const passwordKey = await crypto.subtle.importKey(
            "raw",
            encoder.encode(input.value),
            "PBKDF2",
            false,
            ["deriveKey"]
          );
          window.__unlockStage = "derive";
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: SALT, iterations: ITERATIONS, hash: "SHA-256" },
            passwordKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          window.__unlockStage = "fetch";
          const payloadSources = [
            "https://fastly.jsdelivr.net/gh/197954753-cmyk/jinhui-channel-archive-7k3n9@9f262db/payload.bin",
            "https://raw.githubusercontent.com/197954753-cmyk/jinhui-channel-archive-7k3n9/9f262db/payload.bin",
            "payload.bin"
          ];
          let encrypted;
          for (let sourceIndex = 0; sourceIndex < payloadSources.length; sourceIndex += 1) {
            const source = payloadSources[sourceIndex];
            window.__unlockStage = "fetch-" + sourceIndex;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
              const response = await fetch(source, { cache: "no-store", signal: controller.signal });
              if (!response.ok) continue;
              encrypted = await response.arrayBuffer();
              if (encrypted.byteLength > 0) {
                window.__unlockStage = "payload-" + sourceIndex;
                break;
              }
            } catch (_) {
              encrypted = undefined;
            } finally {
              clearTimeout(timeout);
            }
          }
          if (!encrypted || encrypted.byteLength === 0) throw new Error("加密数据加载失败");
          window.__unlockStage = "decrypt";
          const plaintext = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: IV, tagLength: 128 },
            key,
            encrypted
          );
          window.__unlockStage = "write";
          const html = new TextDecoder().decode(plaintext);
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          showStatus(
            error && error.name === "OperationError"
              ? "口令不正确，请重新输入"
              : "打开失败，请检查网络后重试",
            "error"
          );
          button.disabled = false;
          input.select();
        }
      });
    })();
  </script>
</body>
</html>
